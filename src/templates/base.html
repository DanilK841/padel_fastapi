<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="icon" href="/static/image/logo.svg" type="image/svg+xml">

    <title>{% block title %}Padel Сhamp{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="/static/css/base_main.css">
    <link rel="stylesheet" href="/static/css/common.css">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">

    {% block extra_styles %}{% endblock %}
    <!-- Yandex.Metrika counter -->
<script type="text/javascript">
    (function(m,e,t,r,i,k,a){
        m[i]=m[i]||function(){(m[i].a=m[i].a||[]).push(arguments)};
        m[i].l=1*new Date();
        for (var j = 0; j < document.scripts.length; j++) {if (document.scripts[j].src === r) { return; }}
        k=e.createElement(t),a=e.getElementsByTagName(t)[0],k.async=1,k.src=r,a.parentNode.insertBefore(k,a)
    })(window, document,'script','https://mc.yandex.ru/metrika/tag.js?id=107156829', 'ym');

    ym(107156829, 'init', {ssr:true, webvisor:true, clickmap:true, ecommerce:"dataLayer", referrer: document.referrer, url: location.href, accurateTrackBounce:true, trackLinks:true});
</script>
<noscript><div><img src="https://mc.yandex.ru/watch/107156829" style="position:absolute; left:-9999px;" alt="" /></div></noscript>
<!-- /Yandex.Metrika counter -->
 
</head>
<body>
    <div class="noise"></div>
    <nav>
    <a href="/" class="logo">PADEL<span>CHAMP</span></a>

    <div class="nav-links">
        <a href="/americano" class="nav-link {% block nav_am_desktop %}{% endblock %}">
            <span class="nav-dot nav-dot-am"></span> Американо
        </a>
        <a href="/mexicano" class="nav-link {% block nav_mx_desktop %}{% endblock %}">
            <span class="nav-dot nav-dot-mx"></span> Мексикано
        </a>
    </div>

    <!-- Добавляем мобильную версию -->
    <div class="nav-mobile-toggle" onclick="toggleMobileMenu()">☰</div>
</nav>

<!-- Мобильное меню (скрыто по умолчанию) -->
<div class="nav-mobile-menu" id="mobileMenu">
    <a href="/americano" class="nav-link-mobile {% block nav_am_mobile %}{% endblock %}">
        <span class="nav-dot nav-dot-am"></span> Американо
    </a>
    <a href="/mexicano" class="nav-link-mobile {% block nav_mx_mobile %}{% endblock %}">
        <span class="nav-dot nav-dot-mx"></span> Мексикано
    </a>
</div>
    <main>
        {% block content %}{% endblock %}
    </main>
    <script>
function toggleMobileMenu() {
    const menu = document.getElementById('mobileMenu');
    menu.classList.toggle('visible');
}
</script>
</body>
</html>
